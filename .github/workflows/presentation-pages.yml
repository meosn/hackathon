name: Publish Sourcera presentation

on:
  push:
    branches: [main]
    paths:
      - docs/presentations/Sourcera-4-minute-pitch-EN.html
      - .github/workflows/presentation-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: presentation-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare presentation
        run: |
          mkdir -p _site
          cp docs/presentations/Sourcera-4-minute-pitch-EN.html _site/index.html
      - name: Upload presentation
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
