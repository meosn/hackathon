# Include in the qr.me HTTPS server before generic short-link locations.
location = /PJUMDW {
    alias /opt/sourcera/qr-public/PJUMDW/index.html;
    default_type text/html;
    add_header Cache-Control "no-cache";
}
location ^~ /PJUMDW/api/ {
    rewrite ^/PJUMDW(/api/.*)$ $1 break;
    proxy_pass http://127.0.0.1:8012;
    client_max_body_size 26m;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 180s;
    proxy_buffering off;
}
location ^~ /PJUMDW/ {
    root /opt/sourcera/qr-public;
    try_files $uri $uri/ /PJUMDW/index.html;
}
