[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sourcera"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
 "fastapi>=0.115,<0.130", "uvicorn[standard]>=0.30,<0.40", "pydantic>=2.8,<3",
 "sqlalchemy>=2.0.36,<2.1", "alembic>=1.14,<2", "psycopg[binary]>=3.2,<4",
 "pgvector>=0.3,<0.5", "celery[redis]>=5.4,<6", "httpx>=0.27,<0.29",
 "feedparser>=6,<7", "beautifulsoup4>=4.12,<5", "minio>=7.2,<8", "boto3>=1.35,<2",
 "espeakng-loader>=0.2,<0.3; sys_platform == 'darwin'", "python-multipart>=0.0.20,<1", "PyJWT>=2.10,<3", "email-validator>=2.2,<3"
]
[project.optional-dependencies]
ml = ["sentence-transformers>=3,<6"]
crawl = ["scrapling>=0.3,<0.5"]
test = ["pytest>=8,<10", "websockets>=13,<16", "pyyaml>=6,<7"]
[tool.setuptools.packages.find]
include = ["app*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.package-data]
"app.news" = ["fixtures/*.json"]
